buildscript {
    repositories {
        maven {
            name "Tama's Maven" // Beanification Gradle plugin
            url 'https://maven.tamaized.com/releases/'
            content {
                includeGroup 'tamaized'
            }
        }
        mavenCentral {
            content {
                includeGroup 'org.apache.groovy' // Beanification Gradle plugin dependency
            }
        }
    }
    dependencies {
        classpath "tamaized:beanification:${beanification_version}:gradle"
        // The plugin uses groovyjarjarasm, which Gradle 9 no longer exposes to plugins. Match Gradle's own Groovy version.
        classpath "org.apache.groovy:groovy:${GroovySystem.version}"
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'com.gradleup.shadow' version "${shadowjar_version}"
}

// Injects BeanContext.injectInto(this) into the constructors of @Configurable classes at compile time
apply plugin: 'tamaized.beanification'

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets {
    main.resources {
        // Include resources generated by data generators.
        srcDir('src/generated/resources')

        // Exclude common development only resources from finalized outputs
        exclude("**/*.bbmodel") // BlockBench project files
        exclude(".cache/**") // datagen cache files
    }

    // Data generation. Only the data run fires its event. The production jar does not hold it.
    datagen

    // The dev tools mod. The runs load it. The production jar does not hold it.
    devtools
}

repositories {
    maven {
        name "Tama's Maven" // Beanification, Twilight Forest
        url 'https://maven.tamaized.com/releases/'
        content {
            includeGroup 'tamaized'
            includeGroup 'team-twilight'
        }
    }

    maven {
        name 'NeoForged Maven' // Applied Energistics 2, GuideME
        url 'https://maven.neoforged.net/releases/'
        content {
            includeGroup 'org.appliedenergistics'
        }
    }

    maven {
        name 'Resourceful Bees Maven' // The Bumblezone
        url 'https://maven.resourcefulbees.com/repository/maven-public/'
        content {
            includeGroup 'com.telepathicgrunt'
        }
    }

    maven {
        name 'Wisp Forest Maven' // Accessories, owo-lib
        url 'https://maven.wispforest.io/releases/'
        content {
            includeGroup 'io.wispforest'
        }
    }

    maven {
        name 'Modrinth Maven' // The Aether
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name 'CurseMaven' // Gaia Dimension, Voidscape
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }

    maven {
        name 'BlameJared Maven' // Veil
        url 'https://maven.blamejared.com'
        content {
            includeGroup 'foundry.veil'
            includeGroup 'gg.moonflower' // Veil dependency
            includeGroup 'io.github.ocelot' // Veil dependency
        }
    }

    maven {
        name 'ryanhcode Maven' // imgui-mc
        url 'https://maven.ryanhcode.dev/releases/'
        content {
            includeGroup 'foundry.imguimc'
        }
    }

    maven {
        name 'EngineHub Maven' // WorldEdit
        url 'https://maven.enginehub.org/repo/'
        content {
            includeGroup 'com.sk89q.worldedit'
            includeGroup 'com.sk89q.worldedit.worldedit-libs' // WorldEdit dependency
            includeGroup 'com.sk89q' // WorldEdit dependency
            includeGroup 'com.sk89q.lib' // WorldEdit dependency
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            // The GameTests are in the test source set
            sourceSet = sourceSets.test
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            sourceSet = sourceSets.datagen
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Every run loads the dev tools mod. The IDE builds only the run module.
            taskBefore tasks.named('devtoolsClasses')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.datagen)
            sourceSet(sourceSets.test)
        }
        aerolitedevtools {
            sourceSet(sourceSets.devtools)
        }
    }

    // Runs JUnit tests with the game and the mod on the classpath
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Give the dev tools source set the NeoForge and Minecraft classpath
neoForge.addModdingDependenciesTo(sourceSets.devtools)
neoForge.addModdingDependenciesTo(sourceSets.datagen)

// The plain jar stays unshaded; shadowJar is the production jar
tasks.named('jar', Jar) {
    archiveClassifier = 'slim'
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'tamaized.beanification', 'us.drullk.aerolite.beanification'
    from tasks.named('jarJar')
}

tasks.named('assemble') {
    dependsOn 'shadowJar'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// -Pmute: the client run is quiet. It has its own game directory. It starts with the master volume at zero.
// It skips the early loading window, so the dev tools mixin can keep the game window from taking the focus.
if (project.hasProperty('mute')) {
    neoForge.runs.client {
        gameDirectory = project.file('run-mute')
        systemProperty 'aerolite.devtools.focusWindow', 'false'
    }
}

def muteClient = tasks.register('muteClient') {
    def gameDirectory = neoForge.runs.client.gameDirectory.get().asFile
    def optionsFile = new File(gameDirectory, 'options.txt')
    def fmlConfigFile = new File(gameDirectory, 'config/fml.toml')
    outputs.upToDateWhen { false }
    doLast {
        def options = optionsFile.exists() ? optionsFile.readLines() : []
        options.removeIf { it.startsWith('soundCategory_master:') }
        options.add('soundCategory_master:0.0')
        optionsFile.parentFile.mkdirs()
        optionsFile.text = options.join('\n') + '\n'

        def fmlConfig = fmlConfigFile.exists() ? fmlConfigFile.readLines() : []
        fmlConfig.removeIf { it.trim().startsWith('earlyWindowControl') }
        fmlConfig.add('earlyWindowControl = false')
        fmlConfigFile.parentFile.mkdirs()
        fmlConfigFile.text = fmlConfig.join('\n') + '\n'
    }
}
if (project.hasProperty('mute')) {
    tasks.named('runClient') {
        dependsOn muteClient
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Libraries that shadowJar bundles and relocates into the production jar
    shade
    // Data generation sees the mod and every library of the mod
    datagenImplementation.extendsFrom implementation
    datagenRuntimeOnly.extendsFrom runtimeOnly
    datagenRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    def beanification = "tamaized:beanification:${beanification_version}"
    implementation beanification
    shade beanification
    testImplementation "${beanification}:tests"
    testCompileOnly "${beanification}:test-sources"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.mockito:mockito-junit-jupiter:${mockito_version}"

    implementation "foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}"

    // imgui-mc hosts ImGui for Veil. It is optional. The preview and the F12 panel need it.
    def imguimc = "foundry.imguimc:imguimc-neoforge-${minecraft_version}:${imguimc_version}"
    compileOnly imguimc
    // The mod jar holds the ImGui binding and natives as jar-in-jar libraries.
    localRuntime(imguimc) {
        transitive = false
    }

    // The dev runs load WorldEdit. The code does not reference it.
    localRuntime("com.sk89q.worldedit:worldedit-neoforge-mc${worldedit_minecraft_version}:${worldedit_version}") {
        transitive = false
    }
    // The WorldEdit mod jar does not hold its core. The game layer loads the core as a library.
    additionalRuntimeClasspath("com.sk89q.worldedit:worldedit-core:${worldedit_version}") {
        // Minecraft provides these libraries and pins their versions
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
        exclude group: 'it.unimi.dsi'
        exclude group: 'org.apache.logging.log4j'
    }

    localRuntime "team-twilight:twilightforest:${twilightforest_version}:universal"

    // The dev runs load these dimension mods. The code does not reference them.
    // The Aether jar holds Accessories, Cumulus Menus and Nitrogen Internals. Accessories needs owo-lib.
    localRuntime("maven.modrinth:aether:${aether_version}") {
        transitive = false
    }
    localRuntime("io.wispforest:owo-lib-neoforge:${owolib_version}") {
        transitive = false
    }
    // This Accessories replaces the Aether copy. It also targets the lambda names of the recompiled dev Minecraft.
    localRuntime("io.wispforest:accessories-neoforge:${accessories_version}") {
        transitive = false
    }
    // Applied Energistics 2 needs GuideME as a separate mod.
    localRuntime("org.appliedenergistics:appliedenergistics2:${ae2_version}") {
        transitive = false
    }
    localRuntime("org.appliedenergistics:guideme:${guideme_version}") {
        transitive = false
    }
    // The Bumblezone jar holds Resourceful Lib and Athena.
    localRuntime("com.telepathicgrunt:the_bumblezone:${bumblezone_version}") {
        transitive = false
    }
    localRuntime("curse.maven:gaia-dimension-302529:${gaiadimension_file_id}") {
        transitive = false
    }
    // The CurseForge jar of Voidscape relocates its Beanification copy. The Tamaized maven jar shares the Aerolite copy.
    localRuntime("curse.maven:voidscape-251730:${voidscape_file_id}") {
        transitive = false
    }
    localRuntime("curse.maven:the-undergarden-379849:7862546") {
        transitive = false
    }

    datagenImplementation sourceSets.main.output
    // The dev tools reuse the widgets of the mod. The runs load the mod itself.
    devtoolsCompileOnly sourceSets.main.output
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            veil_version           : veil_version,
            imguimc_version        : imguimc_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
