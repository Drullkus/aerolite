## Dependency Properties
# Beanification 1.6.x is the branch for Minecraft 1.21.1. Do not move to 1.9.
beanification_version=1.6.109
veil_version=4.5.2
# imgui-mc hosts ImGui for Veil. Veil 4.5 accepts imgui-mc 2.x.
imguimc_version=2.0.5
# WorldEdit publishes one NeoForge artifact for every 1.21 patch.
worldedit_minecraft_version=1.21
worldedit_version=7.3.8
shadowjar_version=9.6.1

twilightforest_version=4.8.3345
# The Aether publishes to GitHub Packages, which needs credentials. The Modrinth maven serves its jar.
aether_version=1.21.1-1.5.10-neoforge
owolib_version=0.12.15.6-beta.1+1.21
# The Aether jar holds Accessories beta.48. Its mixin misses the lambda names of the dev Minecraft. Beta.54 matches them.
accessories_version=1.1.0-beta.54+1.21.1
ae2_version=19.2.18
# GuideME 21.1.x is the branch for Minecraft 1.21.1.
guideme_version=21.1.22
bumblezone_version=7.17.3+1.21.1-neoforge
# Gaia Dimension has no maven. This CurseForge file id is gaiadimension-1.21-2.2.288.
gaiadimension_file_id=7021516
# The Tamaized maven jar of Voidscape does not relocate Beanification, so its BeanContext collides with Aerolite.
# This CurseForge file id is Voidscape-1.21.1-1.9.588.jar.
voidscape_file_id=8175491

## Test Properties
junit_version=5.14.4
