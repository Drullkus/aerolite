modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
'''
displayURL="https://www.curseforge.com/minecraft/mc-mods/aerolite"
authors="Drullkus"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Veil renders the tree block
[[dependencies.${mod_id}]]
    modId="veil"
    type="required"
    versionRange="[${veil_version},)"
    ordering="NONE"
    side="BOTH"

# imgui-mc hosts ImGui for Veil. The preview and the ImGui panel need it.
[[dependencies.${mod_id}]]
    modId="imguimc"
    type="optional"
    versionRange="[${imguimc_version},)"
    ordering="NONE"
    side="CLIENT"
